server:
  port: 8082

spring:
  application:
    name: mall-backend
  datasource:
    # H2 文件库(数据持久化到 backend/data/mall.mv.db),MySQL 兼容模式
    url: jdbc:h2:file:./data/mall;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # 每次启动执行 schema.sql 建表(IF NOT EXISTS 幂等)
      mode: always
      schema-locations: classpath:schema.sql
      data-locations:

# 日志
logging:
  level:
    root: info
    com.example.mall: debug
