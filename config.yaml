# coding_agent 默认配置(可被用户级/项目级配置覆盖)。
# 注意:所有 API key 一律走环境变量或 .env,严禁写在此处或代码里。

provider:
  base_url: https://api.deepseek.com   # 任意 OpenAI 兼容网关可换这里
  model: deepseek-v4-flash
  temperature: 0.3
  max_tokens: 8192
  include_usage: true                   # 请求流式 token 用量;若网关报 400 会自动回退
  timeout: 120
  max_retries: 3
  retry_backoff: 2.0

context:
  budget_tokens: 64000                  # 上下文预算,超过自动压缩历史
  compact_ratio: 0.5
  max_tool_output: 30000                # 单条工具结果截断上限(字符)

agent:
  max_iterations: 30                    # 单任务最大工具迭代轮数

permissions:
  mode: interactive                     # interactive | auto-approve | deny
  sandbox: true                         # 工作区沙箱:默认只允许工作区内操作
  allow_tools: []                       # 直接放行的工具
  deny_tools: []                        # 直接拒绝的工具
  ask_tools: [WebSearch]                # 强制确认的工具(联网搜索默认需确认,想放行移入 allow_tools)
  allow_commands: []                    # 正则:自动放行的命令
  dangerous_commands:
    - "rm\\s+-rf"
    - "git\\s+push\\s+--force"
    - "git\\s+reset\\s+--hard"
    - "git\\s+clean\\s+-f"
    - "(^|[;&|])\\s*(mkfs|dd\\s+if=)"
    - "(^|[;&|])\\s*shutdown|reboot"
    - "(^|[;&|])\\s*format\\s+[a-z]:"
  sensitive_paths:
    - ".git"
    - "node_modules"
  sensitive_file_names:
    - ".env"
    - "*.pem"
    - "*.key"
    - "id_rsa"
    - "id_dsa"
    - "id_ed25519"
    - "*.jks"
    - "*.p12"
    - "credentials"
    - "secret"

memory:
  enabled: true
  project_file: .coding_agent/memory/project.md
  user_file: ~/.coding_agent/memory/user.md

# 联网搜索(WebSearch 工具,无 key 抓取 Bing)
search:
  base_url: https://www.bing.com/search   # 也可换 https://cn.bing.com/search
  timeout: 15
  max_results: 5                          # 单次默认返回条数(上限 10)
  proxy: null                             # 代理,形如 http://127.0.0.1:7890

skills:
  dirs:
    - skills
    - .coding_agent/skills
    - ~/.coding_agent/skills

commands:
  dir: .coding_agent/commands

# MCP servers:名称 -> 启动命令。演示服务见 examples/mcp_server_demo.py
mcp:
  servers:
    demo:
      command: python
      args: [examples/mcp_server_demo.py]
      cwd: "."
      env: {}

# 生命周期钩子(可选):事件 -> [ {command: "shell"} 或 {callable: "模块.函数"} ]
hooks: {}

# Agent 团队(可选):/team <名称> <任务> 触发
teams:
  review-team:
    members:
      - name: 架构师
        role: 方案设计与任务拆分
        system_prompt: 先给出整体设计与实现步骤,明确边界
      - name: 工程师
        role: 编码实现
        allow_tools: [ReadFile, WriteFile, EditFile, Glob, Grep, Bash]
      - name: 审查员
        role: 代码审查与缺陷排查
        system_prompt: 从正确性、安全、可维护性角度挑错并给修改建议

  # TSP(Team Software Process)团队:各角色并行评审/推进同一个开发任务,负责人汇总
  # 说明:成员只输出分析与结论文本、不各自写文件(避免散落多份重复文档);
  #       最终交付物由负责人(编排器)统一汇总并写入 workspace 下 <团队名>_汇总.md。
  tsp-team:
    members:
      - name: 团队负责人
        role: 设定目标、协调决策、主持启动与复盘
        system_prompt: 只输出你的分析与结论文本,不要调用 WriteFile 直接写文件,最终交付物由负责人统一汇总写入
        allow_tools: [ReadFile, Glob, Grep]
      - name: 规划经理
        role: 任务拆解、规模/工期估算、计划偏差跟踪
        system_prompt: 给出工作分解(WBS)、每项任务的规模与工期估算、里程碑检查点,并说明如何跟踪计划偏差;只输出分析与结论文本,不要直接写文件,最终交付物由负责人统一汇总写入
        allow_tools: [ReadFile, Glob, Grep]
      - name: 设计经理
        role: 整体与详细设计,设计评审把关
        system_prompt: 先给整体设计(模块/接口/数据流),再给关键模块详细设计,并指出设计风险;只输出分析与结论文本,不要直接写文件,最终交付物由负责人统一汇总写入
        allow_tools: [ReadFile, Glob, Grep]
      - name: 实现经理
        role: 按设计编码与代码自审
        allow_tools: [ReadFile, WriteFile, EditFile, Glob, Grep, Bash]
      - name: 质量经理
        role: 质量目标、缺陷统计与过程数据记录
        system_prompt: 从正确性、可测试性、过程数据角度挑错,统计各阶段缺陷并给出改进项;只输出分析与结论文本,不要直接写文件
        allow_tools: [ReadFile, Glob, Grep]
      - name: 测试经理
        role: 测试方案与验证,缺陷修复回归
        system_prompt: 设计测试用例覆盖边界与异常,验证实现并给出通过/失败清单;只输出分析与结论文本,不要直接写文件
        allow_tools: [ReadFile, Glob, Grep, Bash]

  # Scrum 团队:产品负责人/Scrum教练/开发/测试 并行推进一个冲刺
  # 说明:成员只输出分析与结论文本、不各自写文件;最终交付物由负责人统一汇总写入 <团队名>_汇总.md。
  scrum-team:
    members:
      - name: 产品负责人
        role: 把需求梳理为用户故事并定义优先级与验收标准
        system_prompt: 从用户价值出发,给出用户故事列表(作为…我希望…以便…),每条带验收标准,按优先级排序;只输出分析与结论文本,不要直接写文件,最终交付物由负责人统一汇总写入
        allow_tools: [ReadFile, Glob, Grep]
      - name: Scrum教练
        role: 维护流程、定义冲刺目标与完成定义、扫除阻塞
        system_prompt: 聚焦流程:一句话冲刺目标、完成定义(DoD)、阻塞清单与解决建议;不直接写实现;只输出分析与结论文本,不要直接写文件
        allow_tools: [ReadFile, Glob, Grep]
      - name: 开发成员
        role: 领取故事、增量实现与自测
        allow_tools: [ReadFile, WriteFile, EditFile, Glob, Grep, Bash]
      - name: 测试成员
        role: 验证故事验收标准、回归把关
        system_prompt: 对照每个故事的验收标准设计用例,验证实现,给出通过/未通过与缺陷清单;只输出分析与结论文本,不要直接写文件
        allow_tools: [ReadFile, Glob, Grep, Bash]
